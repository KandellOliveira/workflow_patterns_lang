[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-patterns-lang"
version = "0.1.0"
description = "CLI para testar padrões de workflow inspirados em LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
workflow-patterns = "workflow_patterns_lang.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
